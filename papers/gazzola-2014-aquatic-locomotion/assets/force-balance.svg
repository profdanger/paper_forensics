<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="312" viewBox="0 0 1120 312" role="img" aria-labelledby="t d"><title id="t">Force-balance model of undulatory swimming</title><desc id="d">Body motion generates added-mass-like thrust, balanced either by laminar skin friction or an approximately quadratic drag law; the resulting swimming speed follows a four-thirds or linear Re-Sw exponent.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#102d40"/><stop offset="1" stop-color="#184a54"/></linearGradient></defs><rect width="1120" height="312" rx="24" fill="#0b2636"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="24" y="46" rx="16" width="232" height="197" fill="url(#g)" stroke="#377080"/><text x="140" y="86" font-size="14" fill="#8beee2" font-weight="bold">KINEMATICS</text><path d="M64 155 C97 115 132 194 170 152 S218 136 236 158" fill="none" stroke="#77e7d9" stroke-width="4"/><path d="M216 142 L237 158 L216 175" fill="none" stroke="#77e7d9" stroke-width="3"/><text x="140" y="215" font-size="17" fill="#edf8fb">A · ω · L</text><path d="M258 149 H325" stroke="#55dccc" stroke-width="3"/><path d="M314 141 L327 149 L314 157" fill="none" stroke="#55dccc" stroke-width="3"/><rect x="330" y="61" rx="16" width="260" height="171" fill="url(#g)" stroke="#377080"/><text x="460" y="94" font-size="14" fill="#8beee2" font-weight="bold">EFFECTIVE THRUST</text><text x="460" y="146" fill="#fff" font-size="25">F ~ ρ ω² A² L</text><text x="460" y="185" fill="#bbd8e3" font-size="14">accelerated surrounding water</text><path d="M592 149 H656" stroke="#55dccc" stroke-width="3"/><path d="M647 141 L659 149 L647 157" fill="none" stroke="#55dccc" stroke-width="3"/><rect x="662" y="22" rx="16" width="430" height="113" fill="#123849" stroke="#397080"/><text x="877" y="48" font-size="13" fill="#8beee2" font-weight="bold">LAMINAR SKIN-FRICTION MODEL</text><text x="877" y="77" fill="#fff" font-size="19">F ~ ρ(νL)¹⁄² U³⁄²</text><text x="877" y="106" fill="#83e8d9" font-size="18">Re ~ Sw⁴⁄³</text><rect x="662" y="159" rx="16" width="430" height="113" fill="#123849" stroke="#397080"/><text x="877" y="186" font-size="13" fill="#8beee2" font-weight="bold">QUADRATIC-DRAG MODEL</text><text x="877" y="215" fill="#fff" font-size="19">F ~ ρU²L</text><text x="877" y="244" fill="#83e8d9" font-size="18">Re ~ Sw</text><text x="557" y="293" font-size="12" fill="#a9c6d2">Original explanatory schematic · proportionality factors and full three-dimensional geometry omitted</text></g></svg>