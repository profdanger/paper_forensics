<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="h j"><title id="h">Conceptual Reynolds number versus swimming number plot</title><desc id="j">Schematic double-log graph with slopes four thirds and one. The plot depicts theoretical exponents and qualitative transition only, not original experimental observations or digitized data.</desc><rect width="1100" height="420" rx="20" fill="#0b2636"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="40" font-size="18" fill="#cbe4ed" font-weight="bold">THE SCALING SIGNATURE</text><path d="M105 82 V341 H775" fill="none" stroke="#b7cbd4" stroke-width="2"/><g stroke="#315567" stroke-width="1" stroke-dasharray="3 7"><path d="M105 275 H775 M105 200 H775 M105 125 H775 M225 82 V341 M345 82 V341 M465 82 V341 M585 82 V341 M705 82 V341"/></g><path d="M116 331 C235 295 290 245 355 197 S436 154 473 139 S655 100 766 75" stroke="#55dccc" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M462 150 V341" stroke="#f4bd73" stroke-width="2" stroke-dasharray="5 7"/><circle cx="462" cy="150" r="8" fill="#f4bd73"/><g fill="#c8dee8" font-size="16"><text x="440" y="393" text-anchor="middle">log Swimming number (Sw)</text><text x="39" y="230" transform="rotate(-90 39 230)" text-anchor="middle">log Reynolds number (Re)</text><text x="172" y="230" fill="#8beee2">slope 4/3</text><text x="580" y="120" fill="#8beee2">slope ≈ 1</text><text x="483" y="319" fill="#f4bd73" font-size="14">approximate crossover</text><text x="810" y="132" fill="#f4bd73" font-size="14" font-weight="bold">IMPORTANT</text><text x="810" y="160" font-size="13">The transition is not a</text><text x="810" y="182" font-size="13">verified universal onset</text><text x="810" y="204" font-size="13">of turbulent drag.</text><text x="810" y="272" font-size="13" fill="#adcbd6">Schematic, not measured</text><text x="810" y="294" font-size="13" fill="#adcbd6">or digitized points.</text></g></g></svg>