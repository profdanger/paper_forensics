<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="ti de"><title id="ti">Evidence ladder for the 2010 myosin V AFM study</title><desc id="de">Three distinct evidence classes from direct topography through structural inference to independently tested molecular mechanisms.</desc><rect width="1100" height="310" rx="20" fill="#0c2a3b"/><g font-family="system-ui,sans-serif"><g transform="translate(35 42)"><rect width="320" height="220" rx="16" fill="#123c48" stroke="#368a87"/><text x="22" y="39" fill="#8cefe2" font-weight="750" font-size="20">1 · DIRECTLY IMAGED</text><text x="22" y="79" fill="#e6f8fb" font-size="16">Motor outlines · stepping</text><text x="22" y="110" fill="#e6f8fb" font-size="16">Lever-arm conformations</text><rect x="22" y="151" width="245" height="38" rx="19" fill="#136255"/><text x="41" y="176" fill="#d8fff4" font-weight="700" font-size="14">Highest observation confidence</text></g><g transform="translate(391 42)"><rect width="320" height="220" rx="16" fill="#123546" stroke="#6f8c96"/><text x="22" y="39" fill="#aee9f2" font-weight="750" font-size="20">2 · INFERRED</text><text x="22" y="79" fill="#e6f8fb" font-size="16">Head detachment</text><text x="22" y="110" fill="#e6f8fb" font-size="16">Strain · nucleotide occupancy</text><text x="22" y="141" fill="#e6f8fb" font-size="16">Microscopic kinetic rates</text><rect x="22" y="166" width="245" height="36" rx="18" fill="#48505b"/><text x="40" y="189" fill="#f5f9fa" font-weight="700" font-size="14">Model- and assay-dependent</text></g><g transform="translate(747 42)"><rect width="320" height="220" rx="16" fill="#3b3540" stroke="#b68d69"/><text x="22" y="39" fill="#ffd69e" font-weight="750" font-size="20">3 · TESTED LATER</text><text x="22" y="79" fill="#f2e9e2" font-size="16">Independent head tracking</text><text x="22" y="110" fill="#f2e9e2" font-size="16">FRET · fluorescence</text><text x="22" y="141" fill="#f2e9e2" font-size="16">Mechanochemical modeling</text><rect x="22" y="166" width="255" height="36" rx="18" fill="#75563c"/><text x="39" y="189" fill="#fff1df" font-weight="700" font-size="14">Partial tests, not blanket proof</text></g><path d="M356 155H390M712 155H746" stroke="#f4bd73" stroke-width="3" stroke-dasharray="6 6"/></g></svg>