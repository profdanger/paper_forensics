<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" role="img" aria-label="Conceptual diagram: at shortest lag ballistic mean-squared displacement scales as t squared, then crosses to diffusion proportional to t, and finally an optical trap plateau.">
<rect width="1140" height="360" rx="18" fill="#0c2636"/><text x="40" y="42" fill="#b3eee7" font-size="20" font-family="Arial" font-weight="bold">TIME-RESOLVED BROWNIAN DYNAMICS</text>
<rect x="65" y="80" width="310" height="217" rx="14" fill="#19475d"/><rect x="380" y="80" width="328" height="217" rx="14" fill="#134a4b"/><rect x="713" y="80" width="350" height="217" rx="14" fill="#4b3c2e"/>
<text x="98" y="115" fill="#b5edff" font-size="21" font-weight="bold" font-family="Arial">SHORT LAG</text><text x="98" y="145" fill="white" font-size="22" font-family="Arial">Ballistic: MSD ~ t²</text><text x="98" y="180" fill="#d0e5ef" font-size="17" font-family="Arial">Particle + displaced-fluid inertia</text>
<path d="M115 264 Q164 245 201 203 T302 155" fill="none" stroke="#77d5f3" stroke-width="5"/><text x="414" y="115" fill="#b4f6e4" font-size="21" font-weight="bold" font-family="Arial">INTERMEDIATE LAG</text><text x="414" y="145" fill="white" font-size="22" font-family="Arial">Memory crossover</text><text x="414" y="180" fill="#d0e5ef" font-size="17" font-family="Arial">Vorticity delays decorrelation</text><path d="M430 264 C495 260 543 202 647 191" fill="none" stroke="#62dac1" stroke-width="5"/>
<text x="747" y="115" fill="#ffe2b6" font-size="21" font-weight="bold" font-family="Arial">LONG LAG</text><text x="747" y="145" fill="white" font-size="22" font-family="Arial">Diffusive MSD ~ 2Dt</text><text x="747" y="180" fill="#e0d8ce" font-size="17" font-family="Arial">Later: trap-confined plateau</text><path d="M755 265 C826 210 902 195 1014 195" fill="none" stroke="#f0ba6c" stroke-width="5"/>
<text x="65" y="334" fill="#b4c9d3" font-size="14" font-family="Arial">Original conceptual schematic; not experimental points, fitted equations or published figure reproductions.</text></svg>